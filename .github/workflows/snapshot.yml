name: Quantum Snapshot

on:
  schedule:
    # Every 2 hours. Turso is the single source of truth (no CSV commits,
    # no laptop dependency).
    - cron: '0 */2 * * *'
  # Allow a manual run from the GitHub Actions tab to test without waiting
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install qiskit-ibm-runtime python-dotenv requests

      - name: Fetch device stats and write to Turso
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IONQ_API_KEY: ${{ secrets.IONQ_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python cloud_snapshot.py
